format: fastapi-detail
format_note: >-
  Errors are the FastAPI default envelope {"detail": <string | validation-error array>} with application/json,
  not RFC 9457 application/problem+json. Validation failures (422) return the Pydantic list shape
  [{"type","loc","msg","input"}]. There is no error code field, no type URI and no request id. The MCP and A2A
  surfaces wrap the same REST failures in-band: MCP returns a 200 tool result whose text is a JSON {"error": ...}
  string; A2A returns a completed Task whose artifact data part is {"error": ...}. No OpenAPI exists to derive from;
  every row below is either the docs' own error table or a live observed response.
observed:
- {request: 'GET https://api.nefesh.ai/v1/state (no session_id, no key)', status: 422, body: '{"detail":[{"type":"missing","loc":["query","session_id"],"msg":"Field required","input":null}]}', note: Validation runs before auth on this route.}
- {request: 'GET https://api.nefesh.ai/v1/state?session_id=x (no key)', status: 401, body: '{"detail":"Missing X-Nefesh-Key header."}'}
- {request: 'GET https://api.nefesh.ai/v1/state?session_id=x (bad key)', status: 401, body: '{"detail":"Invalid API key."}'}
