domain_standards:
  note: >-
    REWARD-ONLY check. Nefesh's market (biometric / affective state for AI) has no established interchange standard
    that the contract could declare — no FHIR, HL7, IEEE 11073 or Open mHealth shape appears in the request or
    response schema, and the provider does not claim one. Nefesh instead publishes its OWN open format, the Human
    State Protocol, and implements it; a self-authored spec is recorded but is not credited as an external
    domain-standard conformance.
  entries:
  - id: hsp-1.0
    name: Human State Protocol 1.0 (first-party, Apache 2.0)
    conforms: true
    external: false
    evidence: 'Response documents match schema/hsp-1.0.schema.json in github.com/nefesh-ai/human-state-protocol (required hsp_version const "1.0", state enum, stress_score 0-100, confidence 0-1, suggested_action enum); the docs/quickstart response examples carry exactly these fields.'
  - id: fhir
    conforms: false
    evidence: Not claimed; not a medical device by design (docs/regulatory).
  - id: open-mhealth
    conforms: false
    evidence: Not claimed; signal field names (heart_rate, rmssd, sdnn, spo2) are bespoke.
