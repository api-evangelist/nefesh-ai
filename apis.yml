- name: Nefesh MCP Server
  description: >-
    Hosted remote MCP server at https://mcp.nefesh.ai/mcp (Streamable HTTP, protocol 2025-06-18, session-id
    based; serverInfo nefesh 1.26.0). Anonymous initialize and tools/list succeed and return six tools with full
    inputSchemas — get_human_state, ingest, get_trigger_memory, get_session_history, request_api_key and
    check_api_key_status. The last two work with no key and let an agent self-provision a free key by email
    verification; the other four call the REST API with the X-Nefesh-Key header and return an in-band error
    without one. Published to the official MCP Registry as ai.nefesh/human-state (server.json in the source
    repo), and listed on Smithery and Glama. No stdio package is shipped.
  image: https://nefesh.ai/icon.svg
  humanURL: https://nefesh.ai/docs/mcp
