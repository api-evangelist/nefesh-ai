- name: Nefesh Cognitive Compute Router
  description: >-
    LLM gateway on gateway.nefesh.ai that injects the caller's live human state into the request and adjusts
    temperature before forwarding to an upstream model. Three modes: OpenAI-compatible POST /v1/chat/completions,
    Anthropic passthrough POST /v1/messages, and Unified Anthropic (Anthropic format to any OpenAI-shaped backend).
    Eleven documented backends selected with the X-LLM-Backend header; the caller supplies X-Nefesh-Key,
    X-LLM-Key and X-Nefesh-Subject (or legacy X-Nefesh-Session). Responses carry X-Nefesh-Adapted, X-Nefesh-State,
    X-Nefesh-Backend and X-Nefesh-Reason. Degrades gracefully to a plain passthrough when no signal exists. Source
    is published; no OpenAPI (gateway.nefesh.ai/openapi.json is 404).
  image: https://nefesh.ai/icon.svg
  humanURL: https://nefesh.ai/docs/gateway
