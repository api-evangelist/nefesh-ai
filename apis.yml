apis:
- name: Nefesh Human State API
  description: >-
    REST API on api.nefesh.ai (FastAPI): POST /v1/ingest takes a session_id, an ISO 8601 timestamp and at
    least one of 35+ signal fields and returns the fused state, stress_score, confidence, suggested_action and
    (from the second call) adaptation_effectiveness; GET /v1/state, GET /v1/history (1-60 minute lookback),
    GET /v1/triggers (per-subject trigger memory), POST/GET/DELETE /v1/devices (device registry),
    DELETE /v1/subjects/{subject_id} (GDPR cascading deletion), POST /webhooks/register and /webhooks/retries.
    Device-optimised ingest routes at /ingest/rppg, /ingest/polar, /ingest/garmin. Authenticated with the
    X-Nefesh-Key header (keys prefixed nfsh_). Response format is the open Human State Protocol. No OpenAPI is
    published; api.nefesh.ai/openapi.json and /docs are 404 and a custom HTML page respectively.
  image: https://nefesh.ai/icon.svg
  humanURL: https://nefesh.ai/docs/api
  baseURL: https://api.nefesh.ai
