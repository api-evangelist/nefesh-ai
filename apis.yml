- name: Nefesh Human State Agent (A2A)
  description: >-
    A2A agent served from the MCP host: card at https://mcp.nefesh.ai/.well-known/agent-card.json, JSON-RPC 2.0
    endpoint at POST https://mcp.nefesh.ai/a2a supporting message/send, message/sendStream, tasks/get and
    tasks/cancel. Four skills — get-human-state, ingest-signals, get-trigger-memory, get-session-history — the
    same capability set as the MCP tools. Authentication is X-Nefesh-Key or Authorization: Bearer; an
    unauthenticated message/send returns a completed Task whose artifact carries the auth error rather than a
    JSON-RPC error. The card is 0.2-era in shape (schemaVersion/agentVersion/authSchemes, no protocolVersion) and
    grades flavored against A2A 1.0.0.
