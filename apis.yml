aid: nefesh-ai
name: Nefesh AI
description: >-
  Nefesh AI (nefesh.ai) sells a B2B "human state" middleware API for AI agents: POST live biometric
  signals from any device — heart rate and HRV from a chest strap, webcam rPPG, voice tone, facial
  expression, text sentiment, plus accepted-but-not-yet-fused glucose, EEG, electrodermal, respiratory,
  movement and sleep fields — to one endpoint (api.nefesh.ai/v1/ingest) and get back a unified stress
  score (0-100) mapped to five states with a machine-readable suggested_action and a closed-loop
  adaptation_effectiveness signal. The same capability is exposed four ways: a REST API with webhooks
  and a device registry, a hosted Streamable-HTTP MCP server (6 tools, two of them keyless
  self-provisioning) listed on the official MCP Registry, an A2A agent (4 skills) discovered from a
  card on mcp.nefesh.ai, and a "Cognitive Compute Router" LLM gateway that rewrites system prompt and
  temperature from the live state for OpenAI- and Anthropic-shaped clients. It also maintains the open
  Human State Protocol (HSP 1.0) JSON Schema and an official npm CLI. Positioned as a General Wellness
  product, not a medical device. No OpenAPI is published for any surface.
