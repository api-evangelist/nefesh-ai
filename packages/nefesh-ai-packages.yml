  note: >-
    Nefesh ships ONE published first-party package, the @nefesh/cli command-line tool. It ships no client library
    on any registry: the docs index advertises a "JavaScript SDK — nefesh-client for browser and Node.js" and an
    "Edge rPPG Engine", but /docs/sdk/js and /docs/sdk/rppg both read "Full documentation available soon. Contact
    us for early access", nefesh-client / @nefesh/client / @nefesh/sdk / @nefesh/rppg do not exist on npm, the
    github.com/nefesh-ai/nefesh-sdk and nefesh-wearables repos are empty shells, and nefesh / nefesh-ai / nefesh-sdk
    are absent from PyPI (the unscoped npm `nefesh` is an unrelated 2017 animation library by another author).
    Because the only official package is a CLI and not an SDK, no SDKs pointer is emitted. The published
    integration path is plain HTTP (examples repo in curl, Python fetch/requests, JavaScript fetch, Go net/http).
