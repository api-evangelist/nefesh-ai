summary: Nefesh runs ONE hosted remote MCP server at https://mcp.nefesh.ai/mcp — Streamable HTTP, protocol
  revision 2025-06-18, stateful (an Mcp-Session-Id is issued on initialize and required on every later
  call). Anonymous initialize, tools/list, resources/list, prompts/list and resources/templates/list all
  succeed; six tools are returned with full JSON Schema inputSchemas and are saved verbatim in mcp/nefesh-ai-mcp-tools.json.
  Two tools (request_api_key, check_api_key_status) work with no credential and let an agent self-provision
  a free key by email verification; the other four require the X-Nefesh-Key header and, without it, return
  an in-band error text with isError false. The server is published to the official MCP Registry as ai.nefesh/human-state
  and also self-describes at https://mcp.nefesh.ai/.well-known/mcp.json. No stdio package exists.
deployment:
  mode: remote
  endpoint: https://mcp.nefesh.ai/mcp
  auth: api-key
  verified: probed
  note: 'A hosted HTTPS endpoint an MCP client POSTs to directly; the docs say "no local installation,
    no Docker, no stdio" and no npm/PyPI package ships a server (the GitHub repo is a Python proxy with
    a Dockerfile, not a published stdio distribution). auth is api-key because the data tools need X-Nefesh-Key
    in the client config''s headers block; the transport itself accepts anonymous sessions, and two tools
    are deliberately keyless so an agent can obtain a key in-band. No OAuth: no /.well-known/oauth-protected-resource
    or oauth-authorization-server on mcp.nefesh.ai (both 404, probed 2026-09-19).'
server:
  name: nefesh
  title: Nefesh — Real-Time Human State Awareness for AI
  transport: streamable-http
  url: https://mcp.nefesh.ai/mcp
  stateful: true
  session_header: Mcp-Session-Id
  protocol_version: '2025-06-18'
  server_version: 1.26.0
  version_note: serverInfo.version is 1.26.0; the initialize instructions string says "Version 6.0.0";
    /.well-known/mcp.json says 6.0.0; the MCP Registry entry and agent card say 4.0.0. Four version labels
    for one server.
  instructions: Human State Fusion — send any body signal, get a unified state for your LLM. Includes
    trigger memory for cross-session context. Not a medical device. Version 6.0.0.
  capabilities:
    tools:
      listChanged: false
    resources:
      subscribe: false
      listChanged: false
    prompts:
      listChanged: false
    experimental: {}
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      content_type: text/event-stream
    initialized_notification:
      http_status: 202
    tools_list:
      http_status: 200
      tools: 6
      file: mcp/nefesh-ai-mcp-tools.json
    tools_list_without_session:
      http_status: 400
      error: '-32600 Bad Request: Missing session ID'
    resources_list:
      http_status: 200
      resources: 0
    resources_templates_list:
      http_status: 200
      templates: 1
    prompts_list:
      http_status: 200
      prompts: 0
    get_mcp:
      http_status: 406
      note: GET without an SSE Accept header is refused
      as the transport spec allows: null
    tools_call_without_key:
      http_status: 200
      result_text: '{"error": "API returned 401. Check your API key and parameters."}'
      isError: false
  cors: 'Access-Control-Allow-Origin: *; Allow-Headers Content-Type, X-Nefesh-Key, Mcp-Session-Id, Accept'
authentication:
  header: X-Nefesh-Key
  key_prefix: nfsh_
  anonymous_tools:
  - request_api_key
  - check_api_key_status
  key_required_tools:
  - get_human_state
  - ingest
  - get_trigger_memory
  - get_session_history
  client_config_example:
    mcpServers:
      nefesh:
        url: https://mcp.nefesh.ai/mcp
        headers:
          X-Nefesh-Key: YOUR_API_KEY
  self_provisioning: Connect with no key, have the agent ask the user for a real email, call request_api_key(email),
    poll check_api_key_status(request_id) every 10 s; the user clicks the verification link; the key is
    returned once and the request expires after 15 minutes. Placeholder and disposable emails are blocked
    server-side.
tools:
- name: get_human_state
  description: "Get current unified human state for a session. Call this before generating important responses.\n\
    \n    Returns:\n    - state: calm | relaxed | focused | stressed | acute_stress\n    - stress_score:\
    \ 0-100 (lower = calmer)\n    - confidence: 0.0-1.0 (based on signal quality and device type)\n  \
    \  - suggested_action: maintain_engagement | simplify_and_focus | de-escalate_and_shorten | pause_and_ground\n\
    \    - action_reason: human-readable explanation of why this action was suggested\n    - adaptation_effectiveness\
    \ (on 2nd+ call): shows whether your previous suggested_action actually reduced stress — contains\
    \ previous_action, stress_delta, and effective boolean. Use this to self-improve.\n\n    Use suggested_action\
    \ to adapt your response: calm/relaxed = full complexity, focused = shorter and structured, stressed\
    \ = max 2 sentences, acute_stress = one grounding sentence only.\n\n    Requires a prior ingest call\
    \ to have data. Not a medical device."
  auth_required: true
  read_only: true
  input_schema:
    session_id: string (required)
  rest_binding: GET https://api.nefesh.ai/v1/state?session_id={session_id}
- name: ingest
  description: "Send biometric signals from any sensor, get unified state back.\n\n    Required: session_id\
    \ + timestamp (ISO 8601) + at least one signal.\n    Send whatever you have — the API fuses all signals\
    \ into one state.\n\n    Common signals (highest impact):\n    - heart_rate (bpm, 30-220) + rmssd\
    \ (ms) — cardiovascular\n    - tone: calm | tense | anxious | hostile — vocal\n    - sentiment: -1.0\
    \ to 1.0 — textual\n    - expression: relaxed | neutral | tense — visual\n\n    For trigger memory\
    \ (cross-session psychological tracking):\n    - Include subject_id (consistent per user, hashed)\n\
    \n    Returns same fields as get_human_state plus signals_received list and topics_detected (if conversation\
    \ text was included).\n\n    source_device is optional but improves confidence scoring. Not a medical\
    \ device."
  auth_required: true
  read_only: false
  input_schema:
    session_id: string (required)
    timestamp: string ISO 8601 (required)
    signals: '32 optional nullable fields: heart_rate, rmssd, sdnn, spo2, pnn50, mean_ibi, ibi_count,
      tone, speech_rate, pitch_variability, expression, gaze, posture, engagement, sentiment, urgency,
      glucose_mg_dl, glucose_mmol_l, glucose_trend, eeg_alpha_power, eeg_beta_power, eeg_theta_power,
      cognitive_load, eda, skin_temperature, respiratory_rate, steps_last_minute, activity_level, sleep_stage,
      stress_score, source_device, confidence, subject_id'
  rest_binding: POST https://api.nefesh.ai/v1/ingest
  note: The MCP inputSchema does NOT expose user_message / ai_response or device_id, which the REST /v1/ingest
    accepts — trigger-memory topic extraction and device-registry resolution are REST-only through this
    surface.
- name: get_trigger_memory
  description: "Retrieve psychological trigger profile for a subject.\n\n    Returns which conversation\
    \ topics consistently cause stress (active triggers) and which have been resolved over time.\n\n \
    \   - active triggers: topics where stress was elevated across multiple sessions. Tread carefully.\n\
    \    - resolved triggers: topics where stress has decreased. Safe to explore deeper.\n\n    Each trigger\
    \ includes observation_count, avg_score, peak_score, and last_seen.\n\n    Requires prior ingest calls\
    \ with the same subject_id. Not a medical device."
  auth_required: true
  read_only: true
  input_schema:
    subject_id: string (required)
  rest_binding: GET https://api.nefesh.ai/v1/triggers?subject_id={subject_id}
- name: get_session_history
  description: "Get state history for a session over time.\n\n    Returns timestamped datapoints with\
    \ stress_score, state, and heart_rate for each observation.\n    Includes an overall trend: rising\
    \ | falling | stable.\n\n    Use minutes parameter to control the lookback window (default: 5, max:\
    \ 60).\n    Useful for detecting stress patterns during a conversation. Not a medical device."
  auth_required: true
  read_only: true
  input_schema:
    session_id: string (required)
    minutes: integer (default 5, max 60)
  rest_binding: GET https://api.nefesh.ai/v1/history?session_id={session_id}&minutes={minutes}
- name: delete_subject
  description: "Permanently delete all sessions and trigger memory for a subject.\n\n    Irreversible.\
    \ Only call when the user explicitly requests this deletion."
- name: request_api_key
  description: "Start free API key authorization; no existing API key needed.\n\n    Returns a verification_url.\
    \ Ask the user to open that URL in their\n    browser, enter their own email, then open the verification\
    \ email and\n    confirm access for their agent. This tool\n    does not accept email addresses and\
    \ does not send email.\n    Do not choose, invent, or submit an email on the user's behalf.\n    Poll\
    \ check_api_key_status with the returned request_id at the supplied\n    interval. Stop if the request\
    \ expires. Never create new requests in a loop."
  auth_required: false
  read_only: false
  input_schema:
    email: string (required)
  rest_binding: undocumented (signup flow)
- name: check_api_key_status
  description: "Check a pending API key authorization using its request_id.\n\n    Use request_id exactly\
    \ as returned by request_api_key, never an email.\n    Poll every 10 seconds. awaiting_user means\
    \ the user must open the URL;\n    pending means email verification is still required. ready returns\
    \ the\n    API key once only. Store it and include it in all subsequent HTTP calls.\n    Stop on expired;\
    \ ask the user before starting another authorization."
  auth_required: false
  read_only: true
  input_schema:
    request_id: string (required)
  rest_binding: undocumented (signup flow)
resource_templates:
- name: session_state
  uri_template: nefesh://session/{session_id}/state
  mime_type: text/plain
  description: Live human state for a session. Returns current state as JSON.
  note: Documented at https://nefesh.ai/docs/mcp/resources as a subscribable resource; the live server
    advertises resources.subscribe false, so it is a read, not a subscription.
resources: []
prompts: []
