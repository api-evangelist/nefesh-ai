- kind: well-known
  url: https://mcp.nefesh.ai/.well-known/mcp.json
  http_status: 200
  file: well-known/nefesh-ai-mcp-server-card.json
  note: 'Non-standard self-description manifest (name, version 6.0.0, transport, authentication, tools
    with auth_required flags, one resource, license "Proprietary", contact, a2a_agent_card). It points
    documentation at https://nefesh.ai/llms-full.txt (200, 35 KB) and repository at github.com/tomstuhl/nefesh-mcp-server,
    which 301s to the org repo nefesh-ai/nefesh-mcp-server. DISCREPANCY: the manifest lists SEVEN tools
    including delete_subject ("GDPR-compliant cascading deletion of all data for a subject", auth_required
    true), but the live tools/list returns six — delete_subject is not served. Deletion is reachable only
    through REST DELETE /v1/subjects/{subject_id} or the CLI `nefesh delete`. The manifest also calls
    the session resource "subscribable" while the server advertises resources.subscribe false.'
